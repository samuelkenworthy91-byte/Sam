name: VoiceStudio Pocket TTS Android Preview

on:
  push:
    branches:
      - voicestudio-pockettts-android-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout vetted VoiceStudio source
        uses: actions/checkout@v4
        with:
          repository: debpalash/VoiceStudio
          ref: 429f1e5bb2703ac5b928ab8ba6f60159167e9c44
          path: voicestudio
          persist-credentials: false

      - name: Prepare a separate, independently installable preview app
        working-directory: voicestudio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          build = Path("mobile/android/app/build.gradle.kts")
          text = build.read_text()
          old = 'applicationId = "sh.voicestudio.mobile"'
          assert text.count(old) == 1, "Unexpected upstream Android package ID"
          build.write_text(text.replace(old, 'applicationId = "sh.voicestudio.mobile.pocketpreview"'))
          manifest = Path("mobile/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          old = 'android:label="@string/app_name"'
          assert text.count(old) == 1, "Unexpected upstream app label"
          manifest.write_text(text.replace(old, 'android:label="VoiceStudio Pocket Preview"'))
          catalog = Path("mobile/contract/models.json").read_text().lower()
          assert "pocket" in catalog, "Pocket TTS absent from model catalogue"
          PY

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK, NDK and CMake
        working-directory: voicestudio/mobile/android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" > /dev/null

      - name: Build debug-signed Android APK
        working-directory: voicestudio/mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify package identity, signature, and checksum
        run: |
          set -euo pipefail
          APK="voicestudio/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "^package: name='sh.voicestudio.mobile.pocketpreview'"
          mkdir -p out
          cp "$APK" out/VoiceStudio-PocketTTS-Preview.apk
          (cd out && sha256sum VoiceStudio-PocketTTS-Preview.apk > SHA256SUMS.txt)

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-PocketTTS-Preview-Android
          path: out/
          if-no-files-found: error
          retention-days: 14
